{% set name = "breadability" %}
{% set version = "0.1.21" %}
{% set py_ver = PY_VER %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/breadability-{{ version }}.tar.gz
  sha256: a4ca059c1d1ecd1186076ab6a63a9e184d65d74571c23ce7d9d7dbf4a80b59a7

build:
  number: 0
  noarch: python
  entry_points:
    - breadability = breadability.scripts.client:main
    - breadability-{{ py_ver }} = breadability.scripts.client:main
    - breadability_test = breadability.scripts.test_helper:main
    - breadability_test-{{ py_ver }} = breadability.scripts.test_helper:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - chardet
    - docopt >=0.6.1,<0.7
    - lxml >=2.0
    - lxml-html-clean
    - python >={{ python_min }}

test:
  imports:
    - breadability
  commands:
    - pip check
    - breadability --help
    - breadability-{{ py_ver }} --help
    - breadability_test --help
    - breadability_test-{{ py_ver }} --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/bookieio/breadability
  summary: Port of Readability HTML parser in Python
  license: BSD-2-Clause
  license_file: LICENSE.rst

extra:
  recipe-maintainers:
    - nicornk
    - tobiasploetz
